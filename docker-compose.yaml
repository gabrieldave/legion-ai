# Coolify (build pack Docker Compose). Puerto host 3043 = siguiente libre tras 3042 (crashatlas).
# Dominio público vía Cloudflare Tunnel: legionai.iareal.net
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3043:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /dev/shm:rw,noexec,nosuid,size=8m
      - /var/cache/nginx:rw,noexec,nosuid,size=16m,uid=101,gid=101
      - /var/run:rw,noexec,nosuid,size=8m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
          pids: 64

# Idioma: cookie legion-ai-lang > país (CF-IPCountry) > Accept-Language > es (Ecosistema §12.10).
map $http_cookie $lang_cookie {
    default "";
    "~(?:^|;)\s*legion-ai-lang=(?<lc>es|en)\s*(?:;|$)" $lc;
}

# Con país conocido decide la lista de países en inglés; el resto va a español.
map $http_cf_ipcountry $lang_geo {
    default "";
    US en; GB en; AU en; NZ en; IE en; ZA en; SG en; PH en; JM en; TT en;
    BB en; BS en; BZ en; GY en; AG en; KN en; LC en; VC en; GD en; DM en;
    "~^.+$" es;
}

# Primer tag usable (es/en) de Accept-Language.
map $http_accept_language $lang_al_raw {
    default "";
    "~*^\s*(?:[^,]*,\s*)*?(?<al>es|en)(?:[-_;,\s]|$)" $al;
}

map $lang_al_raw $lang_al {
    default "";
    "~*^en$" en;
    "~*^es$" es;
}

map "$lang_cookie|$lang_geo|$lang_al" $locale {
    default es;
    "~^(?<l1>es|en)\|" $l1;
    "~^\|(?<l2>es|en)\|" $l2;
    "~^\|\|(?<l3>es|en)$" $l3;
}

server {
    listen 8080;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.es.html;

    location = /api/health {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        default_type application/json;
        return 200 '{"ok":true,"app":"legion-ai","commit":"__GIT_COMMIT__"}';
    }

    location = / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        add_header Vary "Cookie, CF-IPCountry, Accept-Language" always;
        add_header Content-Language $locale always;
        try_files /index.$locale.html =404;
    }

    location ~ ^/index(?:\.(?:es|en))?\.html$ {
        return 301 /;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location ~* \.(?:js|css|png|jpe?g|gif|svg|ico|webp|woff2?)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri /;
    }
}
